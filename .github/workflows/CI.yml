on:
  pull_request:
  push:

permissions:
  contents: read

name: CI
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  stable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup install stable -c ${COMPONENTS} -t ${TARGETS} && rustup default stable
        env:
          TARGETS: x86_64-unknown-none
          COMPONENTS: rustfmt
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo check --target=x86_64-unknown-none
      - run: cargo test
      # Ensure that no untracked or tracked files have been added or modified.
      - run: git diff --check --exit-code

  nightly-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup install nightly -c ${COMPONENTS} && rustup default nightly
        env:
          COMPONENTS: clippy
      # Check all entries, including tests and benchmarks.
      - run: cargo clippy --all-targets
